<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox 角色與特效展示舞台</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0b10;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 136, 0.4);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
            pointer-events: none;
            z-index: 10;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 20px;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        p {
            margin: 0;
            font-size: 14px;
            color: #aaa;
        }

        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        button {
            background: linear-gradient(135deg, #111, #222);
            color: #fff;
            border: 2px solid #00ff88;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        button:hover {
            background: #00ff88;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div id="info-panel">
        <h1>Roblox 3D 戰鬥特效舞台</h1>
        <p>點擊下方按鈕或畫面任意處，觸發全螢幕動態斬擊與爪擊特效！</p>
    </div>

    <div id="controls">
        <button onclick="triggerGreenSlash()">綠光雙刀斬</button>
        <button onclick="triggerBlueClaw()">藍色能量爪擊</button>
        <button onclick="triggerDarkMagic()">暗黑惡魔氣場</button>
    </div>

    <!-- 引入 Three.js 與特效相關函式庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 1. 基礎場景與渲染設置 ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0b0b10, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- 2. 燈光設置 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x00ff88, 2, 10);
        pointLight.position.set(0, 2, 0);
        scene.add(pointLight);

        // --- 3. 建立 Roblox 風格角色 (以綠衣骷髏戰士為藍本) ---
        const characterGroup = new THREE.Group();

        // 頭部 (黑色方塊)
        const headGeo = new THREE.BoxGeometry(1, 1, 1);
        const headMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 2.5;
        characterGroup.add(head);

        // 眼睛 (紅色十字星光芒)
        const eyeGeo = new THREE.BoxGeometry(0.3, 0.3, 0.1);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0033 });
        const eye = new THREE.Mesh(eyeGeo, eyeMat);
        eye.position.set(0.2, 2.5, 0.51);
        characterGroup.add(eye);

        // 軀幹 (螢光綠 + 骷髏裝飾感)
        const torsoGeo = new THREE.BoxGeometry(1.5, 2, 1);
        const torsoMat = new THREE.MeshStandardMaterial({ color: 0x39ff14, roughness: 0.2 });
        const torso = new THREE.Mesh(torsoGeo, torsoMat);
        torso.position.y = 1;
        characterGroup.add(torso);

        // 雙臂
        const armGeo = new THREE.BoxGeometry(0.6, 1.8, 0.6);
        const armMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        
        const leftArm = new THREE.Mesh(armGeo, armMat);
        leftArm.position.set(1.2, 1, 0);
        characterGroup.add(leftArm);

        const rightArm = new THREE.Mesh(armGeo, armMat);
        rightArm.position.set(-1.2, 1, 0);
        characterGroup.add(rightArm);

        // 雙腿
        const legGeo = new THREE.BoxGeometry(0.7, 1.8, 0.8);
        const legMat = new THREE.MeshStandardMaterial({ color: 0x333333 });

        const leftLeg = new THREE.Mesh(legGeo, legMat);
        leftLeg.position.set(0.4, -0.9, 0);
        characterGroup.add(leftLeg);

        const rightLeg = new THREE.Mesh(legGeo, legMat);
        rightLeg.position.set(-0.4, -0.9, 0);
        characterGroup.add(rightLeg);

        scene.add(characterGroup);

        // --- 4. 動態特效系統 (刀光與能量軌跡) ---
        let activeEffect = null;

        // 產生半月形綠光斬擊
        function triggerGreenSlash() {
            createSlashEffect(0x00ff88, 3.5);
        }

        // 產生藍色爪擊能量軌跡
        function triggerBlueClaw() {
            createSlashEffect(0x00bfff, 4.5);
        }

        // 產生暗黑惡魔氣場
        function triggerDarkMagic() {
            createSlashEffect(0xff0055, 5.0);
        }

        function createSlashEffect(colorHex, scale) {
            if (activeEffect) scene.remove(activeEffect);

            const geometry = new THREE.RingGeometry(1.5, 2.2, 32, 1, 0, Math.PI);
            const material = new THREE.MeshBasicMaterial({
                color: colorHex,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.9
            });

            activeEffect = new THREE.Mesh(geometry, material);
            activeEffect.position.set(0, 1.5, 0);
            activeEffect.scale.set(0.1, 0.1, 0.1);
            scene.add(activeEffect);

            // 動態放大與淡出動畫
            let progress = 0;
            function animateEffect() {
                if (!activeEffect) return;
                progress += 0.08;
                activeEffect.scale.set(
                    (0.1 + progress) * scale,
                    (0.1 + progress) * scale,
                    (0.1 + progress) * scale
                );
                activeEffect.rotation.z -= 0.1;
                activeEffect.material.opacity = Math.max(0, 1 - progress);

                if (progress < 1) {
                    requestAnimationFrame(animateEffect);
                } else {
                    scene.remove(activeEffect);
                    activeEffect = null;
                }
            }
            animateEffect();
        }

        // 畫面點擊直接觸發預設特效
        window.addEventListener('pointerdown', () => {
            triggerGreenSlash();
        });

        // --- 5. 背景地板 ---
        const floorGeo = new THREE.PlaneGeometry(50, 50);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x14141c, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -1.8;
        scene.add(floor);

        // --- 6. 動畫迴圈 ---
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            let elapsedTime = clock.getElapsedTime();

            // 讓角色有輕微的呼吸浮動感
            characterGroup.position.y = Math.sin(elapsedTime * 3) * 0.08;
            characterGroup.rotation.y = Math.sin(elapsedTime * 1) * 0.15;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 視窗縮放適應
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
