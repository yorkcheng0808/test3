<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Roblox 氣息格鬥遊戲 - 直拳與擊飛優化版</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
            touch-action: none;
        }
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }
        .hud-top {
            display: flex;
            justify-content: space-around;
            width: 100%;
            pointer-events: auto;
        }
        .health-bar-container {
            width: 40%;
            background: rgba(0,0,0,0.5);
            border: 3px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            height: 25px;
        }
        .health-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            transition: width 0.1s;
        }
        #player2-health {
            background: linear-gradient(90deg, #1d976c, #93f9b9);
        }
        #gamepad-status {
            text-align: center;
            color: #00ffff;
            font-size: 16px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 255, 0.4);
            margin: 0 auto;
            pointer-events: auto;
            text-shadow: 0 0 5px rgba(0,255,255,0.5);
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            display: none;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            pointer-events: auto;
            background: rgba(0,0,0,0.7);
            padding: 30px;
            border-radius: 15px;
        }
        #game-over button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
            background: #ff416c;
            border: none;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div class="hud-top">
            <div class="health-bar-container"><div id="player1-health" class="health-bar"></div></div>
            <div class="health-bar-container"><div id="player2-health" class="health-bar"></div></div>
        </div>
        <div style="display: flex; justify-content: center;">
            <div id="gamepad-status">請按下 Switch Pro 手把任意按鈕以啟動控制器</div>
        </div>
        <div></div>
    </div>

    <div id="game-over">
        <div id="game-result">YOU WIN!</div>
        <button onclick="location.reload()">再玩一次</button>
    </div>

    <!-- 導入 Three.js 與特效外掛 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>

    <script>
        const ARENA_SIZE = 18;
        let scene, camera, renderer, composer;
        let player, enemy;
        let clock = new THREE.Clock();
        let isGameOver = false;

        let gamepadVector = new THREE.Vector2(0, 0);
        let lastButtonState = {};
        let gamepadConnected = false;
        let particles = [];

        // --- 建立 Roblox 風格人形角色 ---
        class RobloxCharacter {
            constructor(color, isAI = false) {
                this.isAI = isAI;
                this.health = 100;
                this.maxHealth = 100;
                this.isAttacking = false;
                this.attackType = null;
                this.attackTime = 0;
                this.isBlocking = false;
                this.velocity = new THREE.Vector3();
                this.speed = 0.12;

                this.container = new THREE.Group();

                const matBody = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.2 });
                const matLimbs = new THREE.MeshStandardMaterial({ color: color === 0x0055ff ? 0xcc3333 : 0x223344, roughness: 0.4 });
                const matHead = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.5 });

                this.torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.5, 0.6), matBody);
                this.torso.position.y = 1.75;
                this.container.add(this.torso);

                this.head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), matHead);
                this.head.position.y = 2.75;
                this.container.add(this.head);

                const createDoubleLimb = (isArm) => {
                    const limbGroup = new THREE.Group();
                    const upperGeom = new THREE.BoxGeometry(isArm ? 0.4 : 0.5, isArm ? 0.7 : 0.8, isArm ? 0.4 : 0.5);
                    upperGeom.translate(0, isArm ? -0.35 : -0.4, 0);
                    const upper = new THREE.Mesh(upperGeom, matLimbs);
                    limbGroup.add(upper);

                    const lowerPivot = new THREE.Group();
                    lowerPivot.position.y = isArm ? -0.7 : -0.8;
                    const lowerGeom = new THREE.BoxGeometry(isArm ? 0.35 : 0.45, isArm ? 0.7 : 0.8, isArm ? 0.35 : 0.45);
                    lowerGeom.translate(0, isArm ? -0.35 : -0.4, 0);
                    const lower = new THREE.Mesh(lowerGeom, matLimbs);
                    lowerPivot.add(lower);
                    upper.add(lowerPivot);

                    return { group: limbGroup, upper: upper, lower: lowerPivot };
                };

                this.leftArm = createDoubleLimb(true);
                this.leftArm.group.position.set(-0.8, 2.3, 0);
                this.container.add(this.leftArm.group);

                this.rightArm = createDoubleLimb(true);
                this.rightArm.group.position.set(0.8, 2.3, 0);
                this.container.add(this.rightArm.group);

                this.leftLeg = createDoubleLimb(false);
                this.leftLeg.group.position.set(-0.35, 1.0, 0);
                this.container.add(this.leftLeg.group);

                this.rightLeg = createDoubleLimb(false);
                this.rightLeg.group.position.set(0.35, 1.0, 0);
                this.container.add(this.rightLeg.group);

                scene.add(this.container);
            }

            update(delta) {
                if (isGameOver) return;

                // 套用擊飛速度滑行（被打飛時無卡頓僵直，順暢滑行衰減）
                if (this.velocity.lengthSq() > 0.001) {
                    this.container.position.addScaledVector(this.velocity, delta);
                    this.velocity.multiplyScalar(0.92); // 阻力減速
                }

                // 攻擊動作處理
                if (this.isAttacking) {
                    this.attackTime += delta;
                    const progress = this.attackTime / 0.4;

                    if (this.attackType === 'punch') {
                        // 直拳：整隻右臂直直向前平舉伸出
                        this.rightArm.upper.rotation.set(-Math.PI / 2, 0, 0);
                        this.rightArm.lower.rotation.set(0, 0, 0);
                    } else if (this.attackType === 'kick') {
                        // 飛踢：往前跳衝刺與踢擊
                        this.rightLeg.upper.rotation.x = -Math.PI / 1.2 * Math.sin(progress * Math.PI);
                        this.rightLeg.lower.rotation.x = Math.PI / 2 * Math.sin(progress * Math.PI);
                        
                        const forwardDir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.container.rotation.y);
                        this.container.position.addScaledVector(forwardDir, 0.15);
                    }

                    if (progress >= 1) {
                        this.isAttacking = false;
                        this.attackTime = 0;
                        this.resetPose();
                    }
                    return;
                }

                let isMoving = false;
                if (!this.isAI) {
                    pollGamepad();
                    if (gamepadVector.length() > 0.05) {
                        isMoving = true;
                        const moveDir = new THREE.Vector3(gamepadVector.x, 0, gamepadVector.y);
                        this.container.position.addScaledVector(moveDir, this.speed);
                        
                        const angle = Math.atan2(moveDir.x, moveDir.z);
                        this.container.rotation.y = angle;
                    }
                } else {
                    const dirToPlayer = new THREE.Vector3().subVectors(player.container.position, this.container.position);
                    const dist = dirToPlayer.length();

                    if (dist > 2.2) {
                        isMoving = true;
                        dirToPlayer.y = 0;
                        dirToPlayer.normalize();
                        this.container.position.addScaledVector(dirToPlayer, this.speed * 0.75);
                        
                        const angle = Math.atan2(dirToPlayer.x, dirToPlayer.z);
                        this.container.rotation.y = angle;
                    } else {
                        if (Math.random() < 0.03) {
                            this.triggerAttack(Math.random() < 0.5 ? 'punch' : 'kick');
                        }
                    }
                }

                // 移動走路動畫 vs 靜止拳擊初始預備動作
                if (isMoving) {
                    const t = clock.getElapsedTime() * 12;
                    const swing = Math.sin(t) * 0.6;
                    
                    this.leftArm.upper.rotation.x = swing;
                    this.rightArm.upper.rotation.x = -swing;
                    this.leftLeg.upper.rotation.x = -swing;
                    this.rightLeg.upper.rotation.x = swing;

                    this.leftArm.lower.rotation.x = -Math.abs(Math.sin(t)) * 0.5;
                    this.rightArm.lower.rotation.x = -Math.abs(Math.cos(t)) * 0.5;
                    this.leftLeg.lower.rotation.x = Math.abs(Math.sin(t)) * 0.8;
                    this.rightLeg.lower.rotation.x = Math.abs(Math.cos(t)) * 0.8;
                } else if (this.isBlocking) {
                    // 防禦姿態
                    this.leftArm.upper.rotation.set(-Math.PI / 3, 0, Math.PI / 6);
                    this.rightArm.upper.rotation.set(-Math.PI / 3, 0, -Math.PI / 6);
                    this.leftArm.lower.rotation.set(-Math.PI / 2, 0, 0);
                    this.rightArm.lower.rotation.set(-Math.PI / 2, 0, 0);
                    this.leftLeg.upper.rotation.set(0, 0, 0);
                    this.rightLeg.upper.rotation.set(0, 0, 0);
                } else {
                    // 靜止不動時：拳擊初始預備動作（雙手舉起護臉）
                    this.leftArm.upper.rotation.set(-Math.PI / 4, 0, 0.2);
                    this.rightArm.upper.rotation.set(-Math.PI / 4, 0, -0.2);
                    this.leftArm.lower.rotation.set(-Math.PI / 2, 0, 0);
                    this.rightArm.lower.rotation.set(-Math.PI / 2, 0, 0);
                    this.leftLeg.upper.rotation.set(0, 0, 0);
                    this.rightLeg.upper.rotation.set(0, 0, 0);
                    this.leftLeg.lower.rotation.set(0, 0, 0);
                    this.rightLeg.lower.rotation.set(0, 0, 0);
                }

                // 擂台邊界碰撞與反彈機制
                const bound = ARENA_SIZE / 2 - 1.0;
                let bounced = false;
                if (Math.abs(this.container.position.x) > bound) {
                    this.container.position.x = Math.sign(this.container.position.x) * bound;
                    this.velocity.x = -this.velocity.x * 1.2; // 反彈
                    bounced = true;
                }
                if (Math.abs(this.container.position.z) > bound) {
                    this.container.position.z = Math.sign(this.container.position.z) * bound;
                    this.velocity.z = -this.velocity.z * 1.2; // 反彈
                    bounced = true;
                }

                if (bounced) {
                    createSparks(this.container.position.clone().add(new THREE.Vector3(0, 1, 0)), 0x00ffff);
                }
            }

            resetPose() {
                this.leftArm.upper.rotation.set(0, 0, 0);
                this.rightArm.upper.rotation.set(0, 0, 0);
                this.leftLeg.upper.rotation.set(0, 0, 0);
                this.rightLeg.upper.rotation.set(0, 0, 0);
                this.leftArm.lower.rotation.set(0, 0, 0);
                this.rightArm.lower.rotation.set(0, 0, 0);
                this.leftLeg.lower.rotation.set(0, 0, 0);
                this.rightLeg.lower.rotation.set(0, 0, 0);
            }

            triggerAttack(type) {
                if (this.isAttacking || this.isBlocking) return;
                this.isAttacking = true;
                this.attackType = type;
                this.attackTime = 0;

                const target = this.isAI ? player : enemy;
                const dist = this.container.position.distanceTo(target.container.position);
                
                if (dist < 3.8) {
                    let damage = type === 'punch' ? 12 : 20;
                    if (target.isBlocking) {
                        damage = Math.floor(damage * 0.2);
                    }
                    target.takeDamage(damage, this.container.position);
                    
                    const hitPos = target.container.position.clone().add(new THREE.Vector3(0, 1.5, 0));
                    createSparks(hitPos, target.isBlocking ? 0x00aaff : (type === 'kick' ? 0xffaa00 : 0xffffff));
                    createImpactShockwave(hitPos);
                }
            }

            takeDamage(amount, attackerPos) {
                this.health = Math.max(0, this.health - amount);
                
                // 被打到直接強力打飛（不卡頓，順暢滑行）
                const knockbackDir = new THREE.Vector3().subVectors(this.container.position, attackerPos).normalize();
                this.velocity.copy(knockbackDir).multiplyScalar(12);
                this.velocity.y = 2;

                updateUI();

                if (this.health <= 0) {
                    triggerGameOver(this.isAI ? "YOU WIN!" : "YOU LOSE!");
                }
            }
        }

        // --- 讀取 Switch Pro 手把狀態 ---
        function pollGamepad() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            let gp = null;
            for (let i = 0; i < gamepads.length; i++) {
                if (gamepads[i]) {
                    gp = gamepads[i];
                    break;
                }
            }

            const statusEl = document.getElementById('gamepad-status');

            if (gp) {
                if (!gamepadConnected) {
                    gamepadConnected = true;
                    statusEl.innerText = `已連接手把: ${gp.id}`;
                    statusEl.style.borderColor = '#00ff00';
                    statusEl.style.color = '#00ff00';
                }

                let lx = gp.axes[0];
                let ly = gp.axes[1];
                if (Math.abs(lx) < 0.15) lx = 0;
                if (Math.abs(ly) < 0.15) ly = 0;
                gamepadVector.set(lx, ly);

                const isPressed = (index) => gp.buttons[index] && (gp.buttons[index].pressed || gp.buttons[index].value > 0.5);

                let pressZL = isPressed(6) || isPressed(4);
                let pressZR = isPressed(7) || isPressed(5);
                let pressL  = isPressed(4) || isPressed(6);

                player.isBlocking = pressL;

                if (pressZL && !lastButtonState['ZL']) {
                    player.triggerAttack('punch'); // ZL 直拳
                }
                if (pressZR && !lastButtonState['ZR']) {
                    player.triggerAttack('kick');  // ZR 飛踢
                }

                lastButtonState['ZL'] = pressZL;
                lastButtonState['ZR'] = pressZR;

            } else {
                gamepadConnected = false;
                statusEl.innerText = "請按下 Switch Pro 手把任意按鈕以啟動控制器";
                statusEl.style.borderColor = 'rgba(0, 255, 255, 0.4)';
                statusEl.style.color = '#00ffff';
                gamepadVector.set(0, 0);
            }
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.025);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 12, 16);
            camera.lookAt(0, 2, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            const renderScene = new THREE.RenderPass(scene, camera);
            const bloomPass = new THREE.UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                1.5, 0.4, 0.85
            );

            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            const neonLight1 = new THREE.PointLight(0x00ffff, 3, 30);
            neonLight1.position.set(-8, 5, -8);
            scene.add(neonLight1);

            const neonLight2 = new THREE.PointLight(0xff00ff, 3, 30);
            neonLight2.position.set(8, 5, 8);
            scene.add(neonLight2);

            createArena();

            player = new RobloxCharacter(0x0055ff, false);
            player.container.position.set(0, 0, 5);

            enemy = new RobloxCharacter(0xff2222, true);
            enemy.container.position.set(0, 0, -5);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createArena() {
            const floorGeo = new THREE.PlaneGeometry(ARENA_SIZE, ARENA_SIZE);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x151525, roughness: 0.2, metalness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const gridHelper = new THREE.GridHelper(ARENA_SIZE, 18, 0x00ffff, 0x333355);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);

            const wallHeight = 2.5;
            const wallMat = new THREE.MeshStandardMaterial({
                color: 0x00ffff,
                emissive: 0x00ffff,
                emissiveIntensity: 0.5,
                transparent: true,
                opacity: 0.4,
                roughness: 0.1
            });

            const half = ARENA_SIZE / 2;
            const wGeo = new THREE.BoxGeometry(ARENA_SIZE, wallHeight, 0.4);

            const wall1 = new THREE.Mesh(wGeo, wallMat);
            wall1.position.set(0, wallHeight / 2, -half);
            scene.add(wall1);

            const wall2 = new THREE.Mesh(wGeo, wallMat);
            wall2.position.set(0, wallHeight / 2, half);
            scene.add(wall2);

            const wGeoSide = new THREE.BoxGeometry(0.4, wallHeight, ARENA_SIZE);
            const wall3 = new THREE.Mesh(wGeoSide, wallMat);
            wall3.position.set(-half, wallHeight / 2, 0);
            scene.add(wall3);

            const wall4 = new THREE.Mesh(wGeoSide, wallMat);
            wall4.position.set(half, wallHeight / 2, 0);
            scene.add(wall4);
        }

        function createSparks(pos, colorHex) {
            const pCount = 20;
            const geom = new THREE.BufferGeometry();
            const positions = [];
            const velocities = [];

            for (let i = 0; i < pCount; i++) {
                positions.push(pos.x, pos.y, pos.z);
                velocities.push((Math.random() - 0.5) * 8, Math.random() * 8, (Math.random() - 0.5) * 8);
            }

            geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: colorHex, size: 0.3, transparent: true, blending: THREE.AdditiveBlending });
            const pSystem = new THREE.Points(geom, mat);
            scene.add(pSystem);

            particles.push({ mesh: pSystem, vel: velocities, life: 0.4 });
        }

        function createImpactShockwave(pos) {
            const ringGeo = new THREE.RingGeometry(0.1, 0.8, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.copy(pos);
            ring.rotation.x = Math.PI / 2;
            scene.add(ring);

            particles.push({ isRing: true, mesh: ring, life: 0.3 });
        }

        function updateUI() {
            document.getElementById('player1-health').style.width = (player.health / player.maxHealth * 100) + '%';
            document.getElementById('player2-health').style.width = (enemy.health / enemy.maxHealth * 100) + '%';
        }

        function triggerGameOver(resultText) {
            isGameOver = true;
            document.getElementById('game-result').innerText = resultText;
            document.getElementById('game-over').style.display = 'block';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            player.update(delta);
            enemy.update(delta);

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.life -= delta;

                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                } else {
                    if (p.isRing) {
                        p.mesh.scale.addScalar(delta * 8);
                        p.mesh.material.opacity = p.life * 3;
                    } else {
                        const posArr = p.mesh.geometry.attributes.position.array;
                        for (let j = 0; j < p.vel.length / 3; j++) {
                            posArr[j * 3] += p.vel[j * 3] * delta;
                            posArr[j * 3 + 1] += p.vel[j * 3 + 1] * delta;
                            posArr[j * 3 + 2] += p.vel[j * 3 + 2] * delta;
                            p.vel[j * 3 + 1] -= 9.8 * delta;
                        }
                        p.mesh.geometry.attributes.position.needsUpdate = true;
                        p.material.opacity = p.life * 2.5;
                    }
                }
            }

            const centerPos = new THREE.Vector3()
                .addVectors(player.container.position, enemy.container.position)
                .multiplyScalar(0.5);
            
            camera.position.x += (centerPos.x - camera.position.x) * 0.05;
            camera.position.z += (centerPos.z + 14 - camera.position.z) * 0.05;
            camera.lookAt(centerPos.x, 2, centerPos.z);

            composer.render();
        }

        init();
    </script>
</body>
</html>
