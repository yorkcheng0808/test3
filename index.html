<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #333; display: flex; flex-direction: column; align-items: center; }
        canvas { background: #fff; border: 5px solid #000; cursor: crosshair; }
        #ui { color: white; font-size: 20px; padding: 10px; }
    </style>
</head>
<body>
    <div id="ui">金錢: <span id="money">0</span> | [點擊畫布或按手把 A 鍵召喚]</div>
    <canvas id="game" width="800" height="300"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let money = 100;
    let units = [];
    let lastTime = 0;

    // 遊戲循環
    function gameLoop(timestamp) {
        // 自動賺錢
        if (timestamp - lastTime > 1000) { money += 10; lastTime = timestamp; }
        document.getElementById('money').innerText = money;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 繪製與更新火柴人
        units.forEach((u, i) => {
            u.x += u.speed;
            drawStickman(u.x, 250);
            if (u.x > canvas.width) units.splice(i, 1);
        });

        // 控制器輸入檢測
        const gamepads = navigator.getGamepads();
        if (gamepads[0] && gamepads[0].buttons[0].pressed) spawnUnit(); // 假設按鈕 A 是 0

        requestAnimationFrame(gameLoop);
    }

    function drawStickman(x, y) {
        ctx.beginPath();
        ctx.arc(x, y - 40, 10, 0, Math.PI * 2); // 頭
        ctx.moveTo(x, y - 30); ctx.lineTo(x, y - 10); // 身體
        ctx.moveTo(x, y - 30); ctx.lineTo(x - 10, y - 20); // 左手
        ctx.moveTo(x, y - 30); ctx.lineTo(x + 10, y - 20); // 右手
        ctx.moveTo(x, y - 10); ctx.lineTo(x - 10, y); // 左腳
        ctx.moveTo(x, y - 10); ctx.lineTo(x + 10, y); // 右腳
        ctx.stroke();
    }

    function spawnUnit() {
        if (money >= 50) {
            units.push({ x: 50, speed: 2 });
            money -= 50;
        }
    }

    canvas.addEventListener('mousedown', spawnUnit);
    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
