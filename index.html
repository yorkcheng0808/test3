<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 終極格鬥遊戲 - 彈力繩擂台與高智商 AI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #05050a;
            font-family: Arial, sans-serif;
            touch-action: none;
        }
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }
        .hud-top {
            display: flex;
            justify-content: space-around;
            width: 100%;
            pointer-events: auto;
        }
        .health-bar-container {
            width: 40%;
            background: rgba(0,0,0,0.6);
            border: 3px solid #00ffff;
            border-radius: 12px;
            overflow: hidden;
            height: 28px;
            box-shadow: 0 0 15px rgba(0,255,255,0.4);
        }
        .health-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            transition: width 0.1s ease-out;
        }
        #player2-health {
            background: linear-gradient(90deg, #1d976c, #93f9b9);
        }
        #gamepad-status {
            text-align: center;
            color: #00ffff;
            font-size: 16px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 255, 0.6);
            margin: 0 auto;
            pointer-events: auto;
            text-shadow: 0 0 8px rgba(0,255,255,0.8);
            box-shadow: 0 0 15px rgba(0,255,255,0.2);
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 42px;
            font-weight: bold;
            text-align: center;
            display: none;
            text-shadow: 0 0 15px rgba(255,255,255,0.8);
            pointer-events: auto;
            background: rgba(10, 10, 20, 0.9);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #00ffff;
            box-shadow: 0 0 30px rgba(0,255,255,0.5);
        }
        #game-over button {
            margin-top: 25px;
            padding: 12px 30px;
            font-size: 22px;
            cursor: pointer;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            border: none;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255,65,108,0.6);
            transition: 0.2s;
        }
        #game-over button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div class="hud-top">
            <div class="health-bar-container"><div id="player1-health" class="health-bar"></div></div>
            <div class="health-bar-container"><div id="player2-health" class="health-bar"></div></div>
        </div>
        <div style="display: flex; justify-content: center;">
            <div id="gamepad-status">請按下 Switch Pro 手把任意按鈕以啟動控制器 (ZL:拳 / ZR:踢 / L:防)</div>
        </div>
        <div></div>
    </div>

    <div id="game-over">
        <div id="game-result">YOU WIN!</div>
        <button onclick="location.reload()">再玩一次</button>
    </div>

    <!-- 導入 Three.js 與特效外掛 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>

    <script>
        const ARENA_SIZE = 16;
        let scene, camera, renderer, composer;
        let player, enemy;
        let clock = new THREE.Clock();
        let isGameOver = false;

        let gamepadVector = new THREE.Vector2(0, 0);
        let lastButtonState = {};
        let gamepadConnected = false;
        let particles = [];
        let ringRopes = []; // 用來儲存擂台彈力繩物件

        // --- Roblox 風格角色 (配備拳擊手套 🥊) ---
        class RobloxCharacter {
            constructor(color, isAI = false) {
                this.isAI = isAI;
                this.health = 100;
                this.maxHealth = 100;
                this.isAttacking = false;
                this.attackType = null;
                this.attackTime = 0;
                this.isBlocking = false;
                this.isDead = false;
                this.velocity = new THREE.Vector3();
                this.speed = 0.13;
                
                // AI 專用高智商策略計時器
                this.aiDecisionTimer = 0;
                this.aiActionState = 'idle';

                this.container = new THREE.Group();

                const matBody = new THREE.MeshStandardMaterial({ color: color, roughness: 0.2, metalness: 0.4 });
                const matLimbs = new THREE.MeshStandardMaterial({ color: color === 0x0055ff ? 0x223366 : 0x552222, roughness: 0.4 });
                const matHead = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.3 });
                const matGlove = new THREE.MeshStandardMaterial({ color: 0xff2222, roughness: 0.1, metalness: 0.6, emissive: 0x330000 });

                this.torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.5, 0.6), matBody);
                this.torso.position.y = 1.75;
                this.container.add(this.torso);

                this.head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), matHead);
                this.head.position.y = 2.75;
                this.container.add(this.head);

                const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
                const eyeGeo = new THREE.BoxGeometry(0.15, 0.15, 0.1);
                const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
                leftEye.position.set(-0.2, 2.8, 0.41);
                const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
                rightEye.position.set(0.2, 2.8, 0.41);
                this.container.add(leftEye);
                this.container.add(rightEye);

                const createDoubleLimb = (isArm) => {
                    const limbGroup = new THREE.Group();
                    const upperGeom = new THREE.BoxGeometry(isArm ? 0.4 : 0.5, isArm ? 0.7 : 0.8, isArm ? 0.4 : 0.5);
                    upperGeom.translate(0, isArm ? -0.35 : -0.4, 0);
                    const upper = new THREE.Mesh(upperGeom, matLimbs);
                    limbGroup.add(upper);

                    const lowerPivot = new THREE.Group();
                    lowerPivot.position.y = isArm ? -0.7 : -0.8;
                    const lowerGeom = new THREE.BoxGeometry(isArm ? 0.35 : 0.45, isArm ? 0.7 : 0.8, isArm ? 0.35 : 0.45);
                    lowerGeom.translate(0, isArm ? -0.35 : -0.4, 0);
                    const lower = new THREE.Mesh(lowerGeom, matLimbs);
                    lowerPivot.add(lower);
                    upper.add(lowerPivot);

                    return { group: limbGroup, upper: upper, lower: lowerPivot };
                };

                this.leftArm = createDoubleLimb(true);
                this.leftArm.group.position.set(-0.8, 2.3, 0);
                this.container.add(this.leftArm.group);

                this.rightArm = createDoubleLimb(true);
                this.rightArm.group.position.set(0.8, 2.3, 0);
                this.container.add(this.rightArm.group);

                this.gloveLeft = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.6), matGlove);
                this.gloveLeft.position.set(0, -0.7, 0);
                this.leftArm.lower.add(this.gloveLeft);

                this.gloveRight = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.6), matGlove);
                this.gloveRight.position.set(0, -0.7, 0);
                this.rightArm.lower.add(this.gloveRight);

                this.leftLeg = createDoubleLimb(false);
                this.leftLeg.group.position.set(-0.35, 1.0, 0);
                this.container.add(this.leftLeg.group);

                this.rightLeg = createDoubleLimb(false);
                this.rightLeg.group.position.set(0.35, 1.0, 0);
                this.container.add(this.rightLeg.group);

                scene.add(this.container);
            }

            update(delta) {
                if (isGameOver) return;

                if (this.isDead) {
                    if (this.container.rotation.x > -Math.PI / 2) {
                        this.container.rotation.x -= delta * 4;
                        this.container.position.y = Math.max(0.4, this.container.position.y - delta * 3);
                    }
                    return;
                }

                // 滑行物理慣性
                if (this.velocity.lengthSq() > 0.001) {
                    this.container.position.addScaledVector(this.velocity, delta);
                    this.velocity.multiplyScalar(0.92);
                }

                // 攻擊動畫處理
                if (this.isAttacking) {
                    this.attackTime += delta;
                    const progress = this.attackTime / 0.4;

                    if (this.attackType === 'punch') {
                        this.rightArm.upper.rotation.set(-Math.PI / 2, 0, 0);
                        this.rightArm.lower.rotation.set(0, 0, 0);
                    } else if (this.attackType === 'kick') {
                        this.rightLeg.upper.rotation.x = -Math.PI / 1.2 * Math.sin(progress * Math.PI);
                        this.rightLeg.lower.rotation.x = Math.PI / 2 * Math.sin(progress * Math.PI);
                        
                        const forwardDir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.container.rotation.y);
                        this.container.position.addScaledVector(forwardDir, 0.18);
                    }

                    if (progress >= 1) {
                        this.isAttacking = false;
                        this.attackTime = 0;
                        this.resetPose();
                    }
                    return;
                }

                let isMoving = false;
                if (!this.isAI) {
                    pollGamepad();
                    if (gamepadVector.length() > 0.05) {
                        isMoving = true;
                        const moveDir = new THREE.Vector3(gamepadVector.x, 0, gamepadVector.y);
                        this.container.position.addScaledVector(moveDir, this.speed);
                        
                        const angle = Math.atan2(moveDir.x, moveDir.z);
                        this.container.rotation.y = angle;
                    }
                } else {
                    // --- 高智商聰明 AI 戰術系統 ---
                    this.aiDecisionTimer -= delta;
                    const dirToPlayer = new THREE.Vector3().subVectors(player.container.position, this.container.position);
                    const dist = dirToPlayer.length();

                    if (this.aiDecisionTimer <= 0) {
                        this.aiDecisionTimer = 0.4 + Math.random() * 0.6; // 每隔一段時間重新評估戰術
                        
                        if (player.isAttacking && dist < 3.5) {
                            // 玩家正在攻擊：高智商 AI 有 70% 機率開啟防禦
                            this.isBlocking = Math.random() < 0.7;
                            this.aiActionState = 'block';
                        } else if (dist > 3.5) {
                            // 距離太遠：積極追擊
                            this.isBlocking = false;
                            this.aiActionState = 'chase';
                        } else {
                            // 距離剛好：發動攻擊或小範圍走位
                            this.isBlocking = false;
                            if (Math.random() < 0.65) {
                                this.triggerAttack(Math.random() < 0.5 ? 'punch' : 'kick');
                                this.aiActionState = 'attack';
                            } else {
                                this.aiActionState = 'strafe';
                            }
                        }
                    }

                    if (!player.isDead) {
                        dirToPlayer.y = 0;
                        const angle = Math.atan2(dirToPlayer.x, dirToPlayer.z);
                        this.container.rotation.y = angle;

                        if (this.aiActionState === 'chase' && dist > 2.2) {
                            isMoving = true;
                            dirToPlayer.normalize();
                            this.container.position.addScaledVector(dirToPlayer, this.speed * 0.85);
                        } else if (this.aiActionState === 'strafe') {
                            isMoving = true;
                            // 繞圈環繞走位
                            const strafeDir = new THREE.Vector3(-dirToPlayer.z, 0, dirToPlayer.x).normalize();
                            this.container.position.addScaledVector(strafeDir, this.speed * 0.6);
                        }
                    }
                }

                // 動態步態動畫
                if (isMoving) {
                    const t = clock.getElapsedTime() * 12;
                    const swing = Math.sin(t) * 0.6;
                    
                    this.leftArm.upper.rotation.x = swing;
                    this.rightArm.upper.rotation.x = -swing;
                    this.leftLeg.upper.rotation.x = -swing;
                    this.rightLeg.upper.rotation.x = swing;

                    this.leftArm.lower.rotation.x = -Math.abs(Math.sin(t)) * 0.5;
                    this.rightArm.lower.rotation.x = -Math.abs(Math.cos(t)) * 0.5;
                    this.leftLeg.lower.rotation.x = Math.abs(Math.sin(t)) * 0.8;
                    this.rightLeg.lower.rotation.x = Math.abs(Math.cos(t)) * 0.8;
                } else if (this.isBlocking) {
                    this.leftArm.upper.rotation.set(-Math.PI / 3, 0, Math.PI / 6);
                    this.rightArm.upper.rotation.set(-Math.PI / 3, 0, -Math.PI / 6);
                    this.leftArm.lower.rotation.set(-Math.PI / 1.5, 0, 0);
                    this.rightArm.lower.rotation.set(-Math.PI / 1.5, 0, 0);
                    this.leftLeg.upper.rotation.set(0, 0, 0);
                    this.rightLeg.upper.rotation.set(0, 0, 0);
                } else {
                    this.leftArm.upper.rotation.set(-Math.PI / 3, 0.2, 0.2);
                    this.rightArm.upper.rotation.set(-Math.PI / 3, -0.2, -0.2);
                    this.leftArm.lower.rotation.set(-Math.PI / 1.5, 0, 0);
                    this.rightArm.lower.rotation.set(-Math.PI / 1.5, 0, 0);
                    this.leftLeg.upper.rotation.set(0, 0, 0);
                    this.rightLeg.upper.rotation.set(0, 0, 0);
                    this.leftLeg.lower.rotation.set(0, 0, 0);
                    this.rightLeg.lower.rotation.set(0, 0, 0);
                }

                // --- 撞擊擂台彈力繩機制 (無卡頓、往後彈飛) ---
                const bound = ARENA_SIZE / 2 - 1.2;
                let hitRope = false;
                let ropeSide = '';

                if (this.container.position.x > bound) {
                    this.container.position.x = bound;
                    this.velocity.x = -Math.abs(this.velocity.x) - 7.5; // 強力彈飛
                    hitRope = true; ropeSide = 'right';
                } else if (this.container.position.x < -bound) {
                    this.container.position.x = -bound;
                    this.velocity.x = Math.abs(this.velocity.x) + 7.5; // 強力彈飛
                    hitRope = true; ropeSide = 'left';
                }

                if (this.container.position.z > bound) {
                    this.container.position.z = bound;
                    this.velocity.z = -Math.abs(this.velocity.z) - 7.5; // 強力彈飛
                    hitRope = true; ropeSide = 'front';
                } else if (this.container.position.z < -bound) {
                    this.container.position.z = -bound;
                    this.velocity.z = Math.abs(this.velocity.z) + 7.5; // 強力彈飛
                    hitRope = true; ropeSide = 'back';
                }

                if (hitRope) {
                    createSparks(this.container.position.clone().add(new THREE.Vector3(0, 1.5, 0)), 0xff00aa);
                    triggerRopeVibration(ropeSide);
                }
            }

            resetPose() {
                this.leftArm.upper.rotation.set(0, 0, 0);
                this.rightArm.upper.rotation.set(0, 0, 0);
                this.leftLeg.upper.rotation.set(0, 0, 0);
                this.rightLeg.upper.rotation.set(0, 0, 0);
                this.leftArm.lower.rotation.set(0, 0, 0);
                this.rightArm.lower.rotation.set(0, 0, 0);
                this.leftLeg.lower.rotation.set(0, 0, 0);
                this.rightLeg.lower.rotation.set(0, 0, 0);
            }

            triggerAttack(type) {
                if (this.isAttacking || this.isBlocking || this.isDead) return;
                const target = this.isAI ? player : enemy;
                if (target.isDead) return;

                this.isAttacking = true;
                this.attackType = type;
                this.attackTime = 0;

                const dist = this.container.position.distanceTo(target.container.position);
                
                if (dist < 4.0) {
                    let damage = type === 'punch' ? 12 : 20;
                    if (target.isBlocking) {
                        damage = Math.floor(damage * 0.2);
                    }
                    target.takeDamage(damage, this.container.position);
                    
                    const hitPos = target.container.position.clone().add(new THREE.Vector3(0, 1.5, 0));
                    createSparks(hitPos, target.isBlocking ? 0x00ffff : (type === 'kick' ? 0xffaa00 : 0xffffff));
                    createImpactShockwave(hitPos);
                }
            }

            takeDamage(amount, attackerPos) {
                if (this.isDead) return;
                this.health = Math.max(0, this.health - amount);
                
                const knockbackDir = new THREE.Vector3().subVectors(this.container.position, attackerPos).normalize();
                this.velocity.copy(knockbackDir).multiplyScalar(15);
                this.velocity.y = 3.5;

                updateUI();

                if (this.health <= 0) {
                    this.isDead = true;
                    triggerGameOver(this.isAI ? "YOU WIN!" : "YOU LOSE!");
                }
            }
        }

        // --- Switch Pro 手把讀取 ---
        function pollGamepad() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            let gp = null;
            for (let i = 0; i < gamepads.length; i++) {
                if (gamepads[i]) { gp = gamepads[i]; break; }
            }

            const statusEl = document.getElementById('gamepad-status');

            if (gp) {
                if (!gamepadConnected) {
                    gamepadConnected = true;
                    statusEl.innerText = `已連接手把: ${gp.id}`;
                    statusEl.style.borderColor = '#00ff00';
                    statusEl.style.color = '#00ff00';
                }

                let lx = gp.axes[0];
                let ly = gp.axes[1];
                if (Math.abs(lx) < 0.15) lx = 0;
                if (Math.abs(ly) < 0.15) ly = 0;
                gamepadVector.set(lx, ly);

                const isPressed = (index) => gp.buttons[index] && (gp.buttons[index].pressed || gp.buttons[index].value > 0.5);

                let pressZL = isPressed(6) || isPressed(4);
                let pressZR = isPressed(7) || isPressed(5);
                let pressL  = isPressed(4) || isPressed(6);

                player.isBlocking = pressL;

                if (pressZL && !lastButtonState['ZL']) { player.triggerAttack('punch'); }
                if (pressZR && !lastButtonState['ZR']) { player.triggerAttack('kick'); }

                lastButtonState['ZL'] = pressZL;
                lastButtonState['ZR'] = pressZR;

            } else {
                gamepadConnected = false;
                statusEl.innerText = "請按下 Switch Pro 手把任意按鈕以啟動控制器 (ZL:拳 / ZR:踢 / L:防)";
                statusEl.style.borderColor = 'rgba(0, 255, 255, 0.4)';
                statusEl.style.color = '#00ffff';
                gamepadVector.set(0, 0);
            }
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020208);
            scene.fog = new THREE.FogExp2(0x020208, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 13, 16);
            camera.lookAt(0, 2, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.3;
            document.body.appendChild(renderer.domElement);

            const renderScene = new THREE.RenderPass(scene, camera);
            const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.8, 0.4, 0.8);

            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(10, 25, 10);
            scene.add(dirLight);

            const neonLight1 = new THREE.PointLight(0x00ffff, 4, 35);
            neonLight1.position.set(-10, 6, -10);
            scene.add(neonLight1);

            const neonLight2 = new THREE.PointLight(0xff00aa, 4, 35);
            neonLight2.position.set(10, 6, 10);
            scene.add(neonLight2);

            createArena();

            player = new RobloxCharacter(0x0055ff, false);
            player.container.position.set(0, 0, 5);

            enemy = new RobloxCharacter(0xff2244, true);
            enemy.container.position.set(0, 0, -5);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // --- 建立正方形科技網格與彈力繩擂台 ---
        function createArena() {
            const floorGeo = new THREE.PlaneGeometry(ARENA_SIZE, ARENA_SIZE);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x0f0f1c, roughness: 0.1, metalness: 0.9 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const gridHelper = new THREE.GridHelper(ARENA_SIZE, 16, 0x00ffff, 0x222244);
            gridHelper.position.y = 0.02;
            scene.add(gridHelper);

            // 建立四根角落柱子與多層彈力繩
            const postGeo = new THREE.CylinderGeometry(0.2, 0.2, 3.5, 8);
            const postMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, metalness: 0.8, roughness: 0.2 });
            const half = ARENA_SIZE / 2;

            const corners = [
                [-half, -half], [half, -half], [half, half], [-half, half]
            ];
            corners.forEach(([x, z]) => {
                const post = new THREE.Mesh(postGeo, postMat);
                post.position.set(x, 1.75, z);
                scene.add(post);
            });

            // 建立彈力繩 (上下兩條)
            const ropeMat = new THREE.MeshBasicMaterial({ color: 0xff00aa });
            const ropeGeo = new THREE.CylinderGeometry(0.06, 0.06, ARENA_SIZE, 8);

            const createRopeWall = (x1, z1, x2, z2, sideName) => {
                const group = new THREE.Group();
                const length = ARENA_SIZE;
                const angle = Math.atan2(x2 - x1, z2 - z1);

                const rope1 = new THREE.Mesh(ropeGeo, ropeMat);
                rope1.position.set(0, 1.2, 0);
                rope1.rotation.z = Math.PI / 2;
                rope1.rotation.y = angle;

                const rope2 = new THREE.Mesh(ropeGeo, ropeMat);
                rope2.position.set(0, 2.2, 0);
                rope2.rotation.z = Math.PI / 2;
                rope2.rotation.y = angle;

                group.add(rope1);
                group.add(rope2);
                group.position.set((x1 + x2) / 2, 0, (z1 + z2) / 2);
                scene.add(group);

                ringRopes.push({ group: group, side: sideName, offset: 0, vel: 0 });
            };

            createRopeWall(-half, -half, half, -half, 'back');
            createRopeWall(half, -half, half, half, 'right');
            createRopeWall(half, half, -half, half, 'front');
            createRopeWall(-half, half, -half, -half, 'left');
        }

        // 觸發繩子被撞擊時的彈動視覺回饋
        function triggerRopeVibration(side) {
            const rope = ringRopes.find(r => r.side === side);
            if (rope) {
                rope.vel = 0.8; // 給予彈動速度
            }
        }

        function createSparks(pos, colorHex) {
            const pCount = 25;
            const geom = new THREE.BufferGeometry();
            const positions = [];
            const velocities = [];

            for (let i = 0; i < pCount; i++) {
                positions.push(pos.x, pos.y, pos.z);
                velocities.push((Math.random() - 0.5) * 10, Math.random() * 10, (Math.random() - 0.5) * 10);
            }

            geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: colorHex, size: 0.35, transparent: true, blending: THREE.AdditiveBlending });
            const pSystem = new THREE.Points(geom, mat);
            scene.add(pSystem);

            particles.push({ mesh: pSystem, vel: velocities, life: 0.45 });
        }

        function createImpactShockwave(pos) {
            const ringGeo = new THREE.RingGeometry(0.1, 1.0, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.copy(pos);
            ring.rotation.x = Math.PI / 2;
            scene.add(ring);

            particles.push({ isRing: true, mesh: ring, life: 0.35 });
        }

        function updateUI() {
            document.getElementById('player1-health').style.width = (player.health / player.maxHealth * 100) + '%';
            document.getElementById('player2-health').style.width = (enemy.health / enemy.maxHealth * 100) + '%';
        }

        function triggerGameOver(resultText) {
            isGameOver = true;
            document.getElementById('game-result').innerText = resultText;
            document.getElementById('game-over').style.display = 'block';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            player.update(delta);
            enemy.update(delta);

            // 更新彈力繩物理彈動動畫
            ringRopes.forEach(rope => {
                if (Math.abs(rope.offset) > 0.001 || Math.abs(rope.vel) > 0.001) {
                    rope.vel -= rope.offset * 25 * delta; // 彈簧恢復力
                    rope.vel *= 0.85; // 阻尼衰減
                    rope.offset += rope.vel * delta;
                    
                    if (rope.side === 'back' || rope.side === 'front') {
                        rope.group.position.z += rope.offset * 0.1;
                    } else {
                        rope.group.position.x += rope.offset * 0.1;
                    }
                    rope.offset *= 0.95;
                }
            });

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.life -= delta;

                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                } else {
                    if (p.isRing) {
                        p.mesh.scale.addScalar(delta * 10);
                        p.mesh.material.opacity = p.life * 3;
                    } else {
                        const posArr = p.mesh.geometry.attributes.position.array;
                        for (let j = 0; j < p.vel.length / 3; j++) {
                            posArr[j * 3] += p.vel[j * 3] * delta;
                            posArr[j * 3 + 1] += p.vel[j * 3 + 1] * delta;
                            posArr[j * 3 + 2] += p.vel[j * 3 + 2] * delta;
                            p.vel[j * 3 + 1] -= 9.8 * delta;
                        }
                        p.mesh.geometry.attributes.position.needsUpdate = true;
                        p.material.opacity = p.life * 2.5;
                    }
                }
            }

            const centerPos = new THREE.Vector3()
                .addVectors(player.container.position, enemy.container.position)
                .multiplyScalar(0.5);
            
            camera.position.x += (centerPos.x - camera.position.x) * 0.05;
            camera.position.z += (centerPos.z + 14 - camera.position.z) * 0.05;
            camera.lookAt(centerPos.x, 2, centerPos.z);

            composer.render();
        }

        init();
    </script>
</body>
</html>
