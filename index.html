<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Wars - TinkerCAD 方塊人特製版</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0e14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #ui-container {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            font-size: 18px;
        }
        .score-board {
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 22px;
            border-radius: 8px;
            border: 2px solid #555;
            margin-bottom: 10px;
        }
        #weapon-hud {
            position: absolute;
            bottom: 25px;
            right: 25px;
            background: rgba(0,0,0,0.85);
            color: #00ffaa;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            border: 2px solid #00ffaa;
        }
        #controller-status {
            position: absolute;
            top: 15px;
            right: 25px;
            background: rgba(0,0,0,0.75);
            color: #00ff88;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 15px;
            border: 1px solid #00ff88;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #ff3333;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0,0,0,0.8);
            color: #ddd;
            padding: 14px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.6;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    
    <div id="ui-container">
        <div class="score-board">
            紅隊分數: <span id="redScore">0</span> | 藍隊分數: <span id="blueScore">0</span><br>
            狀態: <span id="gameStatus">TinkerCAD 方塊人搶旗中（子彈無限）</span>
        </div>
    </div>

    <div id="controller-status">手把狀態: <span id="gpState">等待手把連線...</span></div>
    <div id="weapon-hud">當前武器: <span id="currentWeapon">無限突擊步槍</span></div>

    <div id="instructions">
        <b>操作指南：</b><br>
        [ 左搖桿 / 滑鼠 ] 旋轉視角與四角方向<br>
        [ 右搖桿上下 / W, S ] 搖桿往前進、往後退<br>
        [ A 按鈕 / 空白鍵 ] 切換武器 (步槍 ⇄ 砍擊刀光刃)<br>
        [ 上方板機 ZR / 滑鼠左鍵 ] **無限發射子彈**<br>
        [ X 按鈕 / 滑鼠右鍵 ] 挖地板地道
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. 3D 場景初始化 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f141c);
        scene.fog = new THREE.FogExp2(0x0f141c, 0.012);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(40, 80, 40);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 2. 大型地圖與挖地道系統 ---
        const mapSize = 60;
        const blockSize = 2;
        const blocks = [];
        const blockGroup = new THREE.Group();
        scene.add(blockGroup);

        const floorMat = new THREE.MeshLambertMaterial({ color: 0x444f5a });
        const wallMat = new THREE.MeshLambertMaterial({ color: 0x223344 });

        function createLargeMap() {
            for (let x = -mapSize; x <= mapSize; x += blockSize) {
                for (let z = -mapSize; z <= mapSize; z += blockSize) {
                    let h = 2;
                    if (Math.abs(x) < 15 && Math.abs(z) < 15) h = 0.5;
                    else if (Math.sin(x * 0.15) * Math.cos(z * 0.15) > 0.3) h = 4.5;
                    else if (Math.abs(x - z) % 12 === 0) h = 3;

                    const geom = new THREE.BoxGeometry(blockSize, h, blockSize);
                    const mesh = new THREE.Mesh(geom, h > 3 ? wallMat : floorMat);
                    mesh.position.set(x, h / 2, z);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    blockGroup.add(mesh);
                    blocks.push(mesh);
                }
            }
        }
        createLargeMap();

        // --- 3. 完美對應 TinkerCAD 的方塊組合人偶模型 ---
        function createTinkerCADAvatar(teamColor) {
            const characterGroup = new THREE.Group();
            
            // 材質設定
            const skinMat = new THREE.MeshLambertMaterial({ color: 0xd4b08c }); // 膚色圓筒/方頭
            const shirtMat = new THREE.MeshLambertMaterial({ color: teamColor }); // 紅/藍色上衣
            const pantsMat = new THREE.MeshLambertMaterial({ color: 0xd93838 }); // 紅色跨步褲
            const gloveMat = new THREE.MeshLambertMaterial({ color: 0xc49a6c }); // 手套方塊
            const gunMat = new THREE.MeshLambertMaterial({ color: 0x222222 });  // 槍身黑色
            const gunAccMat = new THREE.MeshLambertMaterial({ color: 0xd9572b }); // 橘紅色槍托與裝飾

            // 1. 頭部 (圓柱/方塊混合造型)
            const head = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.7, 12), skinMat);
            head.position.y = 2.3;
            characterGroup.add(head);

            // 2. 軀幹
            const torso = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.2, 0.6), shirtMat);
            torso.position.y = 1.3;
            characterGroup.add(torso);

            // 3. 雙臂與拿槍姿勢 (完美對齊您的截圖：雙手向前微曲持槍)
            const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.1, 0.45), shirtMat);
            leftArm.position.set(-0.75, 1.3, 0.2);
            leftArm.rotation.x = -0.4;
            characterGroup.add(leftArm);

            const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.1, 0.45), shirtMat);
            rightArm.position.set(0.75, 1.3, 0.2);
            rightArm.rotation.x = -0.4;
            characterGroup.add(rightArm);

            // 4. 手套方塊
            const leftHand = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.46, 0.46), gloveMat);
            leftHand.position.set(-0.75, 0.8, 0.5);
            characterGroup.add(leftHand);

            const rightHand = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.46, 0.46), gloveMat);
            rightHand.position.set(0.75, 0.8, 0.5);
            characterGroup.add(rightHand);

            // 5. 步槍本體 (橫跨雙手之間)
            const rifleGroup = new THREE.Group();
            const rifleBody = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 1.8), gunMat);
            rifleBody.position.set(0, 0.85, 0.3);
            rifleBody.rotation.y = 0.2;
            rifleGroup.add(rifleBody);

            const rifleStock = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.4, 0.6), gunAccMat);
            rifleStock.position.set(0, 0.85, 0.9);
            rifleGroup.add(rifleStock);
            characterGroup.add(rifleGroup);

            // 6. 雙腿 (呈跑步前後錯開的方塊結構)
            const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.48, 1.2, 0.48), pantsMat);
            leftLeg.position.set(-0.28, 0.5, -0.3);
            leftLeg.rotation.x = 0.4;
            characterGroup.add(leftLeg);

            const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.48, 1.2, 0.48), pantsMat);
            rightLeg.position.set(0.28, 0.5, 0.3);
            rightLeg.rotation.x = -0.4;
            characterGroup.add(rightLeg);

            return { group: characterGroup, parts: { leftLeg, rightLeg } };
        }

        // --- 4. 遊戲實體類別 ---
        class PlayerEntity {
            constructor(isControlled, team, x, z) {
                this.isControlled = isControlled;
                this.team = team;
                this.color = (team === 'red') ? 0xc73232 : 0x2b6fc7;
                this.avatarData = createTinkerCADAvatar(this.color);
                this.mesh = this.avatarData.group;
                this.mesh.position.set(x, 0, z);
                scene.add(this.mesh);

                this.health = 100;
                this.hasFlag = false;
                this.speed = 0.14;
            }

            update(targetPos) {
                if (this.health <= 0) return;
                if (!this.isControlled) {
                    let targetX = targetPos.x;
                    let targetZ = targetPos.z;
                    if (this.hasFlag) {
                        targetX = (this.team === 'red') ? -50 : 50;
                        targetZ = 0;
                    }

                    const dx = targetX - this.mesh.position.x;
                    const dz = targetZ - this.mesh.position.z;
                    const dist = Math.sqrt(dx*dx + dz*dz);

                    if (dist > 1.5) {
                        this.mesh.position.x += (dx / dist) * (this.speed * 0.85);
                        this.mesh.position.z += (dz / dist) * (this.speed * 0.85);
                        this.mesh.rotation.y = Math.atan2(dx, dz);
                    }

                    const t = Date.now() * 0.01;
                    this.avatarData.parts.leftLeg.rotation.x = Math.sin(t) * 0.6;
                    this.avatarData.parts.rightLeg.rotation.x = -Math.sin(t) * 0.6;
                }
            }
        }

        const entities = [];
        entities.push(new PlayerEntity(true, 'red', -50, 0));  // 玩家
        entities.push(new PlayerEntity(false, 'red', -48, 8)); // 紅隊 AI
        entities.push(new PlayerEntity(false, 'red', -48, -8));
        entities.push(new PlayerEntity(false, 'blue', 50, 0)); // 藍隊 AI
        entities.push(new PlayerEntity(false, 'blue', 48, 8));
        entities.push(new PlayerEntity(false, 'blue', 48, -8));

        // --- 5. 旗幟系統 ---
        const flags = [
            { team: 'red', position: new THREE.Vector3(-55, 0, 0), holder: null, mesh: createFlagMesh(0xff3b3b) },
            { team: 'blue', position: new THREE.Vector3(55, 0, 0), holder: null, mesh: createFlagMesh(0x3b82f6) }
        ];

        function createFlagMesh(color) {
            const group = new THREE.Group();
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 3.5), new THREE.MeshBasicMaterial({ color: 0x999999 }));
            pole.position.y = 1.75;
            group.add(pole);

            const cloth = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.7, 0.1), new THREE.MeshBasicMaterial({ color: color }));
            cloth.position.set(0.6, 2.9, 0);
            group.add(cloth);

            scene.add(group);
            return group;
        }
        flags.forEach(f => f.mesh.position.copy(f.position));

        // --- 6. 武器與無限子彈系統 ---
        let currentWeaponIndex = 0;
        const weaponNames = ["無限突擊步槍", "砍擊刀劍"];
        const bullets = [];
        const slashEffects = [];

        function shootBullet(pos, dir, team) {
            const bGeom = new THREE.SphereGeometry(0.25, 8, 8);
            const bMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
            const bMesh = new THREE.Mesh(bGeom, bMat);
            bMesh.position.copy(pos);
            bMesh.position.y += 1.5;
            scene.add(bMesh);
            bullets.push({ mesh: bMesh, dir: dir, team: team, life: 100 });
        }

        function triggerSlashEffect(pos, dir, team) {
            const slashGroup = new THREE.Group();
            slashGroup.position.copy(pos);
            slashGroup.position.y += 1.5;

            const arcMat = new THREE.MeshBasicMaterial({ color: 0x2288ff, transparent: true, opacity: 0.9, side: THREE.DoubleSide });
            const arcGeom = new THREE.RingGeometry(0.8, 1.8, 16, 1, 0, Math.PI);
            const arcMesh = new THREE.Mesh(arcGeom, arcMat);
            slashGroup.add(arcMesh);
            scene.add(slashGroup);

            slashEffects.push({ group: slashGroup, dir: dir.clone(), life: 30, team: team });
        }

        function digBlock() {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(blockGroup.children);
            if (intersects.length > 0 && intersects[0].distance < 12) {
                blockGroup.remove(intersects[0].object);
                const idx = blocks.indexOf(intersects[0].object);
                if (idx > -1) blocks.splice(idx, 1);
            }
        }

        // --- 7. 輸入設定 ---
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space') {
                currentWeaponIndex = (currentWeaponIndex + 1) % weaponNames.length;
                document.getElementById('currentWeapon').innerText = weaponNames[currentWeaponIndex];
            }
            if (e.code === 'KeyX') digBlock();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        let cameraAngleY = 0, cameraAngleX = 0.35;
        let prevButtonA = false, prevButtonZR = false, prevButtonX = false;

        // --- 8. 遊戲主迴圈 ---
        let redScore = 0, blueScore = 0;

        function animate() {
            requestAnimationFrame(animate);

            const player = entities[0];
            let moveInput = 0;
            let fireTriggered = false;

            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            let gp = null;
            for (let i = 0; i < gamepads.length; i++) {
                if (gamepads[i]) { gp = gamepads[i]; break; }
            }

            if (gp) {
                document.getElementById('gpState').innerText = "已連線 (Switch Pro)";
                document.getElementById('gpState').style.color = "#00ff88";

                // 右搖桿垂直 (axes[3])：往前推代表往前，往後拉代表往後
                const rightStickY = gp.axes[3];
                if (Math.abs(rightStickY) > 0.15) {
                    moveInput = -rightStickY; 
                }

                // 左搖桿水平 (axes[0])：視角旋轉
                const lookX = gp.axes[0];
                const lookY = gp.axes[1];
                if (Math.abs(lookX) > 0.15) cameraAngleY -= lookX * 0.04;
                if (Math.abs(lookY) > 0.15) {
                    cameraAngleX += lookY * 0.03;
                    cameraAngleX = Math.max(0.1, Math.min(1.3, cameraAngleX));
                }

                const buttonA = gp.buttons[0] && gp.buttons[0].pressed;
                if (buttonA && !prevButtonA) {
                    currentWeaponIndex = (currentWeaponIndex + 1) % weaponNames.length;
                    document.getElementById('currentWeapon').innerText = weaponNames[currentWeaponIndex];
                }
                prevButtonA = buttonA;

                const buttonX = gp.buttons[2] && gp.buttons[2].pressed;
                if (buttonX && !prevButtonX) digBlock();
                prevButtonX = buttonX;

                const buttonZR = (gp.buttons[7] && gp.buttons[7].pressed) || (gp.buttons[5] && gp.buttons[5].pressed);
                if (buttonZR && !prevButtonZR) {
                    fireTriggered = true;
                }
                prevButtonZR = buttonZR;

            } else {
                document.getElementById('gpState').innerText = "未偵測到手把 (使用鍵盤 W/S)";
                document.getElementById('gpState').style.color = "#ffaa00";

                if (keys['KeyW']) moveInput = 1;
                if (keys['KeyS']) moveInput = -1;
            }

            if (moveInput !== 0) {
                const moveAngle = cameraAngleY;
                player.mesh.position.x += Math.sin(moveAngle) * (player.speed * moveInput);
                player.mesh.position.z += Math.cos(moveAngle) * (player.speed * moveInput);
                player.mesh.rotation.y = moveAngle + (moveInput < 0 ? Math.PI : 0);

                const t = Date.now() * 0.015;
                player.avatarData.parts.leftLeg.rotation.x = Math.sin(t) * 0.6;
                player.avatarData.parts.rightLeg.rotation.x = -Math.sin(t) * 0.6;
            }

            if (fireTriggered) {
                const dir = new THREE.Vector3(Math.sin(cameraAngleY), 0, Math.cos(cameraAngleY));
                if (currentWeaponIndex === 0) {
                    shootBullet(player.mesh.position, dir, 'red');
                } else {
                    triggerSlashEffect(player.mesh.position, dir, 'red');
                }
            }

            // 攝影機跟隨
            const cx = player.mesh.position.x - Math.sin(cameraAngleY) * Math.cos(cameraAngleX) * 9;
            const cy = player.mesh.position.y + Math.sin(cameraAngleX) * 9 + 2;
            const cz = player.mesh.position.z - Math.cos(cameraAngleY) * Math.cos(cameraAngleX) * 9;
            camera.position.set(cx, cy, cz);
            camera.lookAt(player.mesh.position.x, player.mesh.position.y + 1.5, player.mesh.position.z);

            entities.forEach(ent => {
                if (!ent.isControlled) {
                    const targetFlag = flags.find(f => f.team !== ent.team);
                    ent.update(targetFlag ? targetFlag.mesh.position : player.mesh.position);
                }
            });

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.mesh.position.addScaledVector(b.dir, 0.8);
                b.life--;

                entities.forEach(ent => {
                    if (ent.team !== b.team && ent.mesh.position.distanceTo(b.mesh.position) < 1.2) {
                        ent.health -= 25;
                        b.life = 0;
                        if (ent.health <= 0) {
                            ent.health = 100;
                            ent.mesh.position.set(ent.team === 'red' ? -50 : 50, 0, (Math.random() - 0.5) * 15);
                        }
                    }
                });

                if (b.life <= 0) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            for (let i = slashEffects.length - 1; i >= 0; i--) {
                const s = slashEffects[i];
                s.group.position.addScaledVector(s.dir, 0.9);
                s.group.rotation.z += 0.2;
                s.group.scale.multiplyScalar(1.03);
                s.life--;

                if (s.life <= 0) {
                    scene.remove(s.group);
                    slashEffects.splice(i, 1);
                } else {
                    entities.forEach(ent => {
                        if (ent.team !== s.team && ent.mesh.position.distanceTo(s.group.position) < 2.5) {
                            ent.health -= 35;
                            s.life = 0;
                            if (ent.health <= 0) {
                                ent.health = 100;
                                ent.mesh.position.set(ent.team === 'red' ? -50 : 50, 0, (Math.random() - 0.5) * 15);
                            }
                        }
                    });
                }
            }

            flags.forEach(flag => {
                if (!flag.holder) {
                    entities.forEach(ent => {
                        if (ent.team !== flag.team && ent.mesh.position.distanceTo(flag.mesh.position) < 1.8) {
                            flag.holder = ent;
                            ent.hasFlag = true;
                        }
                    });
                } else {
                    flag.mesh.position.copy(flag.holder.mesh.position);
                    flag.mesh.position.y += 2.8;

                    const baseZoneX = (flag.holder.team === 'red') ? -55 : 55;
                    if (Math.abs(flag.holder.mesh.position.x - baseZoneX) < 4) {
                        if (flag.holder.team === 'red') redScore++;
                        else blueScore++;

                        document.getElementById('redScore').innerText = redScore;
                        document.getElementById('blueScore').innerText = blueScore;

                        flag.holder.hasFlag = false;
                        flag.holder = null;
                        flag.mesh.position.copy(flag.position);
                    }
                }
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('mousedown', e => {
            const playerEntity = entities[0];
            const dir = new THREE.Vector3(Math.sin(cameraAngleY), 0, Math.cos(cameraAngleY));
            if (e.button === 0) {
                if (currentWeaponIndex === 0) shootBullet(playerEntity.mesh.position, dir, 'red');
                else triggerSlashEffect(playerEntity.mesh.position, dir, 'red');
            } else if (e.button === 2) {
                digBlock();
            }
        });
        window.addEventListener('contextmenu', e => e.preventDefault());

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
