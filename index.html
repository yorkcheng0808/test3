<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>3D Arena LightSaber Smash</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 50px;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }
        .hud-box {
            background: rgba(20, 20, 30, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid #555;
            text-align: center;
        }
        #cooldown-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 20px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            z-index: 10;
        }
        #cooldown-fill {
            width: 100%;
            height: 100%;
            background: #00ffcc;
            transition: width 0.1s linear;
        }
        #instructions {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 14px;
            z-index: 10;
            text-align: center;
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        <div class="hud-box" style="border-color: #ff3344;">
            <div>P1 (玩家) 生命值</div>
            <div id="p1-hp" style="font-size: 24px; color: #ff3344;">100</div>
        </div>
        <div class="hud-box" style="border-color: #00d2ff;">
            <div>P2 (AI 敵手) 生命值</div>
            <div id="p2-hp" style="font-size: 24px; color: #00d2ff;">100</div>
        </div>
    </div>

    <div id="instructions">【控制方式】鍵盤 A/D 移動, W 跳躍, J 揮劍, K 發射劍刺 | 或使用手柄：左搖桿移動, A鍵發射劍刺</div>

    <div id="cooldown-bar">
        <div id="cooldown-fill"></div>
    </div>

<script>
// --- 遊戲初始化與場景設定 ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);
scene.fog = new THREE.FogExp2(0x050510, 0.015);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
// 視角拉到最大以完整看到雙方與岩漿邊緣縫隙
camera.position.set(0, 22, 32);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// --- 燈光設定 ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(20, 40, 20);
dirLight.castShadow = true;
scene.add(dirLight);

// --- 3D 競技場與邊緣縫隙、岩漿 ---
// 外圍岩漿
const lavaGeo = new THREE.PlaneGeometry(200, 200);
const lavaMat = new THREE.MeshBasicMaterial({ color: 0xff3300 });
const lavaMesh = new THREE.Mesh(lavaGeo, lavaMat);
lavaMesh.rotation.x = -Math.PI / 2;
lavaMesh.position.y = -5;
scene.add(lavaMesh);

// 主島嶼平台（帶有邊緣縫隙可以把人打下去）
const arenaGeo = new THREE.BoxGeometry(24, 2, 24);
const arenaMat = new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.4 });
const arena = new THREE.Mesh(arenaGeo, arenaMat);
arena.position.y = -1;
arena.receiveShadow = true;
scene.add(arena);

// 四塊邊緣小平台與縫隙
const platforms = [];
const pConfigs = [
    { x: -15, z: 0 }, { x: 15, z: 0 }, { x: 0, z: -15 }, { x: 0, z: 15 }
];
pConfigs.forEach(pos => {
    const pGeo = new THREE.BoxGeometry(6, 1.5, 6);
    const pMat = new THREE.MeshStandardMaterial({ color: 0x444466 });
    const pMesh = new THREE.Mesh(pGeo, pMat);
    pMesh.position.set(pos.x, -0.5, pos.z);
    pMesh.receiveShadow = true;
    scene.add(pMesh);
    platforms.push(pMesh);
});

// --- 角色與長光劍類別 ---
class Fighter {
    constructor(x, z, color, isAI = false) {
        this.isAI = isAI;
        this.hp = 100;
        this.mesh = new THREE.Group();
        this.mesh.position.set(x, 0, z);

        // 身體
        const bodyGeo = new THREE.BoxGeometry(1.2, 2.2, 0.8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: color });
        this.body = new THREE.Mesh(bodyGeo, bodyMat);
        this.body.position.y = 1.1;
        this.body.castShadow = true;
        this.mesh.add(this.body);

        // 頭部
        const headGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 2.4;
        this.mesh.add(head);

        // 拿著的長長光劍
        const saberGroup = new THREE.Group();
        // 劍柄
        const hiltGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.8);
        const hiltMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const hilt = new THREE.Mesh(hiltGeo, hiltMat);
        hilt.position.y = 0.4;
        saberGroup.add(hilt);

        // 長光劍刃
        const bladeGeo = new THREE.CylinderGeometry(0.12, 0.12, 4.5);
        const bladeMat = new THREE.MeshBasicMaterial({ color: color });
        this.bladeMesh = new THREE.Mesh(bladeGeo, bladeMat);
        this.bladeMesh.position.y = 2.8;
        saberGroup.add(this.bladeMesh);

        saberGroup.position.set(0.9, 1.0, 0.8);
        saberGroup.rotation.x = Math.PI / 4;
        this.saber = saberGroup;
        this.mesh.add(saberGroup);

        scene.add(this.mesh);

        this.vx = 0;
        this.vz = 0;
        this.vy = 0;
        this.isGrounded = true;
        this.speed = 0.15;
        this.swordAngle = 0;
        this.isSwinging = false;
        
        // 劍刺冷卻
        this.spikeCooldown = 0;
    }

    update(opponent) {
        if (this.hp <= 0) return;

        // 物理移動與重力
        this.vy -= 0.015;
        this.mesh.position.y += this.vy;
        this.mesh.position.x += this.vx;
        this.mesh.position.z += this.vz;

        // 簡單地板與平台碰撞檢測 (若掉落小於 -4 則落入岩漿)
        if (this.mesh.position.y < -4) {
            this.hp = 0;
            return;
        }

        // 簡易島嶼平台地面判定
        if (this.mesh.position.y <= 0 && 
            Math.abs(this.mesh.position.x) < 13 && 
            Math.abs(this.mesh.position.z) < 13) {
            this.mesh.position.y = 0;
            this.vy = 0;
            this.isGrounded = true;
        }

        // 殘影效果：生成殘影殘留物
        if (Math.abs(this.vx) > 0.01 || Math.abs(this.vz) > 0.01 || this.isSwinging) {
            createTrail(this.mesh.position, this.body.material.color);
        }

        // 減速
        this.vx *= 0.85;
        this.vz *= 0.85;

        // AI 邏輯
        if (this.isAI) {
            let dx = p1.mesh.position.x - this.mesh.position.x;
            let dz = p1.mesh.position.z - this.mesh.position.z;
            let dist = Math.sqrt(dx*dx + dz*dz);
            if (dist > 2) {
                this.mesh.position.x += (dx / dist) * 0.06;
                this.mesh.position.z += (dz / dist) * 0.06;
            }
            // AI 揮劍面向玩家
            this.mesh.lookAt(p1.mesh.position);
        }
    }

    swing() {
        if (this.isSwinging) return;
        this.isSwinging = true;
        let t = 0;
        let interval = setInterval(() => {
            t += 0.2;
            this.saber.rotation.z = Math.sin(t) * 1.5;
            if (t > Math.PI) {
                clearInterval(interval);
                this.saber.rotation.z = 0;
                this.isSwinging = false;
            }
        }, 20);
    }
}

const p1 = new Fighter(-6, 0, 0xff3344, false);
const p2 = new Fighter(6, 0, 0x00d2ff, true);

// --- 殘影特效系統 ---
const trails = [];
function createTrail(pos, color) {
    const geo = new THREE.BoxGeometry(1.2, 2.2, 0.8);
    const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.4 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(pos);
    mesh.position.y += 1.1;
    scene.add(mesh);
    trails.push({ mesh: mesh, life: 15 });
}

// --- 發射劍刺系統 ---
const spikes = [];
function fireSpike(fighter, target) {
    if (fighter.spikeCooldown > 0) return;
    fighter.spikeCooldown = 300; // 5秒冷卻 (60fps * 5)

    const spikeGeo = new THREE.ConeGeometry(0.3, 2, 8);
    const spikeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
    const spike = new THREE.Mesh(spikeGeo, spikeMat);
    spike.position.copy(fighter.mesh.position);
    spike.position.y += 1.5;

    // 計算朝向對手的方向向量
    const dir = new THREE.Vector3().subVectors(target.mesh.position, fighter.mesh.position).normalize();
    spike.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    
    scene.add(spike);
    spikes.push({ mesh: spike, dir: dir, speed: 0.4 });
}

// --- 輸入控制 (支援鍵盤與 Gamepad 搖桿) ---
const keys = {};
window.addEventListener('keydown', (e) => { keys[e.code] = true; });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function handleInput() {
    // 鍵盤控制 P1
    if (keys['KeyA']) p1.vx = -p1.speed;
    if (keys['KeyD']) p1.vx = p1.speed;
    if (keys['KeyW']) p1.vz = -p1.speed;
    if (keys['KeyS']) p1.vz = p1.speed;
    if (keys['KeyJ']) p1.swing();
    if (keys['KeyK']) fireSpike(p1, p2);

    // Gamepad 實體搖桿控制 (如 Switch Pro 手把)
    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
    if (gamepads[0]) {
        const gp = gamepads[0];
        // 左搖桿移動
        let ax = gp.axes[0];
        let ay = gp.axes[1];
        if (Math.abs(ax) > 0.1) p1.vx = ax * p1.speed;
        if (Math.abs(ay) > 0.1) p1.vz = ay * p1.speed;

        // A 鍵 (通常是 buttons[0] 或 buttons[1] 依瀏覽器而定，通常 Switch A 是右側下方的按鈕)
        if (gp.buttons[0] && gp.buttons[0].pressed) {
            fireSpike(p1, p2);
        }
        // X 鍵或 B 鍵揮劍
        if (gp.buttons[1] && gp.buttons[1].pressed) {
            p1.swing();
        }
    }
}

// --- 遊戲主循環 ---
function animate() {
    requestAnimationFrame(animate);

    handleInput();

    p1.update(p2);
    p2.update(p1);

    // 更新劍刺冷卻計數與介面
    if (p1.spikeCooldown > 0) p1.spikeCooldown--;
    let cdPercent = (p1.spikeCooldown / 300) * 100;
    document.getElementById('cooldown-fill').style.width = (100 - cdPercent) + '%';
    document.getElementById('cooldown-fill').style.background = p1.spikeCooldown === 0 ? '#00ffcc' : '#ffaa00';

    // 更新劍刺飛行與碰撞
    for (let i = spikes.length - 1; i >= 0; i--) {
        let s = spikes[i];
        s.mesh.position.addScaledVector(s.dir, s.speed);

        // 碰撞 P2 檢測
        if (s.mesh.position.distanceTo(p2.mesh.position) < 2) {
            p2.hp -= 25;
            // 擊飛效果
            p2.vx += s.dir.x * 0.8;
            p2.vz += s.dir.z * 0.8;
            scene.remove(s.mesh);
            spikes.splice(i, 1);
            continue;
        }

        // 超出範圍移除
        if (s.mesh.position.length() > 60) {
            scene.remove(s.mesh);
            spikes.splice(i, 1);
        }
    }

    // 更新殘影特效
    for (let i = trails.length - 1; i >= 0; i--) {
        let t = trails[i];
        t.life--;
        t.mesh.material.opacity -= 0.03;
        if (t.life <= 0) {
            scene.remove(t.mesh);
            trails.splice(i, 1);
        }
    }

    // 更新 UI 血量
    document.getElementById('p1-hp').innerText = Math.max(0, p1.hp);
    document.getElementById('p2-hp').innerText = Math.max(0, p2.hp);

    renderer.render(scene, camera);
}

animate();

// 視窗縮放適應
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
