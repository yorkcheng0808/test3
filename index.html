<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高擬真 3D 坦克模擬器 - 完整版</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b0b0b; font-family: 'Segoe UI', sans-serif; user-select: none; }
        #ui-layer { position: absolute; top: 20px; left: 20px; pointer-events: none; }
        #info {
            color: #d1d1d1; background: rgba(15, 15, 15, 0.85); padding: 18px 24px; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); border-left: 5px solid #d4af37;
            backdrop-filter: blur(5px); margin-bottom: 10px;
        }
        #gamepad-status {
            color: #ffcc00; background: rgba(0, 0, 0, 0.7); padding: 10px 15px;
            border-radius: 5px; font-weight: bold; display: inline-block;
        }
        #info h2 { margin: 0 0 10px 0; font-size: 18px; color: #d4af37; }
        #info p { margin: 6px 0; font-size: 13px; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="info">
            <h2>★ 主戰坦克作戰模擬器</h2>
            <p><b>W/S 前進後退, A/D 左右轉向</b></p>
            <p><b>滑鼠：瞄準與射擊</b></p>
            <p><b>手把：左類比搖桿移動, A鍵射擊</b></p>
        </div>
        <div id="gamepad-status">搖桿未連接 (請按一下搖桿任意鍵)</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. 場景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x3a4248);
        scene.fog = new THREE.FogExp2(0x3a4248, 0.01);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 燈光
        const ambientLight = new THREE.AmbientLight(0xddeeff, 0.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
        dirLight.position.set(100, 150, 100);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 地板
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ color: 0x3b4438 }));
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // 坦克群組
        const tank = new THREE.Group();
        const paintMat = new THREE.MeshStandardMaterial({ color: 0x475238, roughness: 0.5 });
        const darkMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.7 });
        
        // 車體
        const hull = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.9, 5.6), paintMat);
        hull.position.y = 0.8;
        tank.add(hull);

        // 砲塔
        const turretGroup = new THREE.Group();
        turretGroup.position.y = 1.45;
        const turret = new THREE.Mesh(new THREE.SphereGeometry(1.3, 24, 16).scale(1.1, 0.7, 1.3), paintMat);
        turretGroup.add(turret);

        // 砲管
        const barrelGroup = new THREE.Group();
        barrelGroup.position.set(0, 0.4, 0.8);
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 5, 16).rotateX(Math.PI/2), darkMat);
        barrel.position.z = 2.4;
        barrelGroup.add(barrel);
        turretGroup.add(barrelGroup);
        tank.add(turretGroup);
        scene.add(tank);

        // 控制變數
        const keys = { w: false, a: false, s: false, d: false };
        let tankSpeed = 0;
        const roadWheels = []; // 動態輪子

        // 輸入處理
        window.addEventListener('keydown', (e) => { if(e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { if(e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false; });

        // 射擊邏輯
        const bullets = [];
        function triggerFire() {
            const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshBasicMaterial({color: 0xffaa00}));
            const pos = new THREE.Vector3(0, 0, 5.0).applyMatrix4(barrelGroup.matrixWorld);
            bullet.position.copy(pos);
            bullet.userData = { dir: new THREE.Vector3(0,0,1).applyQuaternion(turretGroup.quaternion).applyQuaternion(tank.quaternion), life: 100 };
            scene.add(bullet);
            bullets.push(bullet);
        }
        window.addEventListener('mousedown', triggerFire);

        // 搖桿邏輯
        const gpStatus = document.getElementById('gamepad-status');
        let gamepadIndex = null;
        window.addEventListener("gamepadconnected", (e) => { gamepadIndex = e.gamepad.index; gpStatus.innerText = "已連: " + e.gamepad.id; gpStatus.style.color = "#4CAF50"; });

        // 動畫
        function animate() {
            requestAnimationFrame(animate);
            
            // 手把輸入
            const gp = navigator.getGamepads()[gamepadIndex];
            if(gp) {
                keys.w = gp.axes[1] < -0.2; keys.s = gp.axes[1] > 0.2;
                keys.a = gp.axes[0] < -0.2; keys.d = gp.axes[0] > 0.2;
                if(gp.buttons[0].pressed && Math.random() > 0.9) triggerFire();
            }

            // 物理移動
            if(keys.w) tankSpeed = Math.min(tankSpeed + 0.02, 0.3);
            else if(keys.s) tankSpeed = Math.max(tankSpeed - 0.02, -0.15);
            else tankSpeed *= 0.92;
            
            tank.translateZ(tankSpeed);
            if(Math.abs(tankSpeed) > 0.01) {
                if(keys.a) tank.rotation.y += 0.03 * (tankSpeed > 0 ? 1 : -1);
                if(keys.d) tank.rotation.y -= 0.03 * (tankSpeed > 0 ? 1 : -1);
            }

            // 子彈
            bullets.forEach((b, i) => {
                b.position.addScaledVector(b.userData.dir, 2);
                if(--b.userData.life < 0) { scene.remove(b); bullets.splice(i, 1); }
            });

            // 鏡頭
            camera.position.set(tank.position.x - Math.sin(tank.rotation.y)*15, tank.position.y+7, tank.position.z - Math.cos(tank.rotation.y)*15);
            camera.lookAt(tank.position);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
