<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Super Smash Stickmen - Ultimate Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f0f1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 1280px;
            height: 720px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(138, 43, 226, 0.3);
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #333;
        }
        canvas {
            display: block;
            background: linear-gradient(135deg, #1f1c2c 0%, #928DAB 100%);
        }
        .ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            padding: 25px 40px;
        }
        .player-hud {
            display: flex;
            flex-direction: column;
            width: 42%;
        }
        .player-hud.p2 {
            align-items: flex-end;
        }
        .hud-name {
            font-size: 22px;
            font-weight: 900;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .p1-color { color: #ff3355; }
        .p2-color { color: #3388ff; }
        
        .health-bar-container {
            width: 100%;
            height: 32px;
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid #fff;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            position: relative;
        }
        .health-fill {
            height: 100%;
            width: 100%;
            transition: width 0.1s ease-out;
        }
        .p1-fill { background: linear-gradient(90deg, #ff1a40, #ff8800); }
        .p2-fill { background: linear-gradient(90deg, #0055ff, #00ccff); }

        .controls-hint {
            position: absolute;
            bottom: 12px;
            width: 100%;
            text-align: center;
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            pointer-events: none;
            letter-spacing: 1px;
        }

        #win-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #win-screen.active {
            opacity: 1;
            pointer-events: auto;
        }
        #win-text {
            font-size: 64px;
            font-weight: 900;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255,255,255,0.8);
            animation: pulse 1.5s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
        .btn {
            background: #ff3355;
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255,51,85,0.4);
            transition: transform 0.1s, background 0.2s;
        }
        .btn:hover { background: #ff1a40; transform: scale(1.05); }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    
    <div class="ui-overlay">
        <div class="player-hud p1">
            <div class="hud-name p1-color">PLAYER 1 (WASD + Space/E/R)</div>
            <div class="health-bar-container">
                <div id="p1-health" class="health-fill p1-fill" style="width: 100%;"></div>
            </div>
        </div>
        <div class="player-hud p2">
            <div class="hud-name p2-color">PLAYER 2 (Gamepad/Arrows + Y/X/A)</div>
            <div class="health-bar-container">
                <div id="p2-health" class="health-fill p2-fill" style="width: 100%;"></div>
            </div>
        </div>
    </div>

    <div class="controls-hint">
        P1: 移動 [W A S D] | 普攻 [空白鍵] | 上鉤拳 [E] | 飛踢 [R] &nbsp;&nbsp;|&nbsp;&nbsp; P2: 左搖桿移動 | 普攻 [X/A鈕] | 上鉤拳 [Y鈕] | 飛踢 [R按鈕] (支援鍵盤方向鍵+數字鍵測試)
    </div>

    <div id="win-screen">
        <div id="win-text">PLAYER 1 WINS!</div>
        <button class="btn" onclick="resetGame()">再玩一次</button>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Audio Synthesizer for punchy sound effects without external assets
const AudioSys = {
    ctx: null,
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
    },
    playTone(freq, type, duration, vol=0.1) {
        try {
            this.init();
            if(!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
    },
    punch() { this.playTone(150, 'triangle', 0.1, 0.2); },
    kick() { this.playTone(80, 'square', 0.15, 0.25); },
    hit() { this.playTone(300, 'sawtooth', 0.1, 0.2); },
    special() {
        this.init();
        if(!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
    }
};

// Particle System for maximal visual effects
class ParticleSystem {
    constructor() {
        this.particles = [];
    }
    emit(x, y, color, count=15, speed=8, life=30) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const spd = Math.random() * speed + 2;
            this.particles.push({
                x, y,
                vx: Math.cos(angle) * spd,
                vy: Math.sin(angle) * spd,
                color,
                size: Math.random() * 6 + 3,
                alpha: 1,
                decay: 1 / life
            });
        }
    }
    emitShockwave(x, y, color) {
        this.particles.push({
            x, y,
            radius: 10,
            maxRadius: 80 + Math.random() * 40,
            color,
            alpha: 1,
            isShockwave: true
        });
    }
    update() {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            if (p.isShockwave) {
                p.radius += 5;
                p.alpha -= 0.05;
                if (p.alpha <= 0) this.particles.splice(i, 1);
            } else {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.3; // gravity
                p.alpha -= p.decay;
                if (p.alpha <= 0) this.particles.splice(i, 1);
            }
        }
    }
    draw(ctx) {
        ctx.save();
        for (let p of this.particles) {
            ctx.globalAlpha = Math.max(0, p.alpha);
            if (p.isShockwave) {
                ctx.strokeStyle = p.color;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.stroke();
            } else {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        ctx.restore();
    }
}

const particles = new ParticleSystem();

// Input Handler
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    AudioSys.init();
    if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => {
    keys[e.code] = false;
});

class Fighter {
    constructor(x, color, isPlayer1) {
        this.startX = x;
        this.color = color;
        this.isPlayer1 = isPlayer1;
        this.reset();
    }

    reset() {
        this.x = this.startX;
        this.y = 500;
        this.width = 40;
        this.height = 100;
        this.vx = 0;
        this.vy = 0;
        this.speed = 5;
        this.jumpForce = -15;
        this.gravity = 0.8;
        this.groundY = 560;
        this.isGrounded = false;
        this.health = 100;
        this.facing = this.isPlayer1 ? 1 : -1;
        
        this.state = 'idle'; // idle, walk, crouch, jump, attack, hit, knocked_down
        this.animTimer = 0;
        this.attackCooldown = 0;
        this.knockdownTimer = 0;
        this.hitStunTimer = 0;
        
        // Attack hitbox
        this.hitbox = { x: 0, y: 0, w: 0, h: 0, active: false, damage: 0, kbX: 0, kbY: 0 };
    }

    update(opponent) {
        if (this.health <= 0) return;

        // Timers
        if (this.attackCooldown > 0) this.attackCooldown--;
        if (this.hitStunTimer > 0) {
            this.hitStunTimer--;
            if (this.hitStunTimer === 0 && this.state === 'hit') this.state = 'idle';
        }
        if (this.knockdownTimer > 0) {
            this.knockdownTimer--;
            this.state = 'knocked_down';
            if (this.knockdownTimer === 0) {
                this.state = 'idle';
                this.vy = -10; // get up bounce
            }
            return; // Can't act while knocked down
        }

        // Handle inputs based on player
        let moveLeft = false, moveRight = false, jump = false, crouch = false;
        let punch = false, uppercut = false, kick = false;

        if (this.isPlayer1) {
            moveLeft = keys['KeyA'];
            moveRight = keys['KeyD'];
            jump = keys['KeyW'];
            crouch = keys['KeyS'];
            if (keys['Space'] && this.attackCooldown === 0) punch = true;
            if (keys['KeyE'] && this.attackCooldown === 0) uppercut = true;
            if (keys['KeyR'] && this.attackCooldown === 0) kick = true;
        } else {
            // Player 2: Support Gamepad API + Arrow Keys / Numpad / IJKL fallback
            let gp = null;
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            for (let g of gamepads) {
                if (g) { gp = g; break; }
            }

            if (gp) {
                const ax = gp.axes[0];
                const ay = gp.axes[1];
                if (ax < -0.4) moveLeft = true;
                if (ax > 0.4) moveRight = true;
                if (ay < -0.4 || gp.buttons[12]?.pressed) jump = true;
                if (ay > 0.4 || gp.buttons[13]?.pressed) crouch = true;
                
                // Switch controller mapping according to user prompt:
                // Y button (index 2) = uppercut, X button (index 3) = flying kick, A button (index 0) = punch
                if ((gp.buttons[0]?.pressed || gp.buttons[1]?.pressed) && this.attackCooldown === 0) punch = true; // A/B button for punch
                if (gp.buttons[2]?.pressed && this.attackCooldown === 0) uppercut = true; // Y button for uppercut
                if (gp.buttons[3]?.pressed && this.attackCooldown === 0) kick = true; // X button for flying kick
            }

            // Keyboard fallbacks for P2 testing (Arrow keys + I, O, P)
            if (keys['ArrowLeft']) moveLeft = true;
            if (keys['ArrowRight']) moveRight = true;
            if (keys['ArrowUp']) jump = true;
            if (keys['ArrowDown']) crouch = true;
            if (keys['KeyI'] && this.attackCooldown === 0) punch = true;
            if (keys['KeyO'] && this.attackCooldown === 0) uppercut = true;
            if (keys['KeyP'] && this.attackCooldown === 0) kick = true;
        }

        // Physics & Movement
        if (this.state !== 'attack' || this.isGrounded) {
            if (crouch && this.isGrounded) {
                this.state = 'crouch';
                this.vx = 0;
            } else if (moveLeft) {
                this.vx = -this.speed;
                this.facing = -1;
                if (this.isGrounded && this.state !== 'attack') this.state = 'walk';
            } else if (moveRight) {
                this.vx = this.speed;
                this.facing = 1;
                if (this.isGrounded && this.state !== 'attack') this.state = 'walk';
            } else {
                this.vx = 0;
                if (this.isGrounded && this.state !== 'attack' && this.state !== 'crouch') {
                    this.state = 'idle';
                }
            }

            if (jump && this.isGrounded && this.state !== 'crouch') {
                this.vy = this.jumpForce;
                this.isGrounded = false;
                this.state = 'jump';
                AudioSys.playTone(400, 'sine', 0.1, 0.1);
            }
        }

        // Attacks
        if (punch) {
            this.executeAttack('punch', 8, 12, 6, -3, 15);
        } else if (uppercut) {
            this.executeAttack('uppercut', 22, 20, 8, -18, 30); // 1st skill: Uppercut knocks up & down for 1s (60 frames)
        } else if (kick) {
            this.executeAttack('kick', 18, 25, 14, -8, 25); // 2nd skill: Flying kick knocks back & down for 1s
        }

        // Apply Gravity
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;

        // Ground collision
        if (this.y + this.height >= this.groundY) {
            this.y = this.groundY - this.height;
            this.vy = 0;
            this.isGrounded = true;
            if (this.state === 'jump') this.state = 'idle';
        }

        // Screen boundaries
        if (this.x < 50) this.x = 50;
        if (this.x + this.width > canvas.width - 50) this.x = canvas.width - 50 - this.width;

        // Animation timer
        this.animTimer += 0.15;

        // Hitbox collision check with opponent
        if (this.hitbox.active) {
            // Check collision with opponent hurtbox
            const opBox = { x: opponent.x, y: opponent.y, w: opponent.width, h: opponent.height };
            if (this.isColliding(this.hitbox, opBox)) {
                this.hitbox.active = false; // hit once per attack
                opponent.takeDamage(this.hitbox.damage, this.hitbox.kbX * this.facing, this.hitbox.kbY, this.hitbox.knockdown);
            }
        }
    }

    executeAttack(type, damage, range, kbX, kbY, cooldown) {
        this.state = 'attack';
        this.attackCooldown = cooldown;
        this.animTimer = 0;
        
        let isKnockdown = (type === 'uppercut' || type === 'kick');
        
        this.hitbox = {
            x: this.facing === 1 ? this.x + this.width : this.x - range - 10,
            y: type === 'uppercut' ? this.y - 20 : this.y + 10,
            w: range + 10,
            h: type === 'uppercut' ? 80 : 50,
            active: true,
            damage: damage,
            kbX: kbX,
            kbY: kbY,
            knockdown: isKnockdown
        };

        if (type === 'punch') {
            AudioSys.punch();
            particles.emit(this.hitbox.x + this.hitbox.w/2, this.hitbox.y + 25, '#fff', 8, 5, 15);
        } else if (type === 'uppercut') {
            AudioSys.special();
            particles.emitShockwave(this.x + (this.facing*30), this.y + 50, '#ffaa00');
            particles.emit(this.x + (this.facing*40), this.y, '#ff3300', 20, 10, 25);
        } else if (type === 'kick') {
            AudioSys.kick();
            this.vx = this.facing * 12; // rush forward for flying kick
            particles.emitShockwave(this.x + (this.facing*40), this.y + 40, '#00ffff');
            particles.emit(this.x + (this.facing*50), this.y + 30, '#00ccff', 25, 12, 30);
        }

        // Disable hitbox after 12 frames
        setTimeout(() => {
            this.hitbox.active = false;
            if (this.state === 'attack') this.state = 'idle';
        }, 200);
    }

    isColliding(b1, b2) {
        return b1.x < b2.x + b2.w && b1.x + b1.w > b2.x && b1.y < b2.y + b2.h && b1.y + b1.h > b2.y;
    }

    takeDamage(dmg, kbX, kbY, isKnockdown) {
        this.health = Math.max(0, this.health - dmg);
        AudioSys.hit();
        particles.emit(this.x + this.width/2, this.y + this.height/2, '#ff0055', 25, 10, 25);
        
        this.vx = kbX;
        this.vy = kbY;
        this.isGrounded = false;

        if (isKnockdown) {
            this.state = 'knocked_down';
            this.knockdownTimer = 60; // exactly 1 second (60 fps)
            particles.emitShockwave(this.x + this.width/2, this.groundY, '#ffffff');
        } else {
            this.state = 'hit';
            this.hitStunTimer = 15;
        }

        updateUI();
        checkWinCondition();
    }

    draw(ctx) {
        ctx.save();
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        let cx = this.x + this.width / 2;
        let cy = this.y;

        if (this.state === 'knocked_down') {
            // Knocked down on the ground flat
            ctx.save();
            ctx.translate(cx, this.groundY - 15);
            ctx.rotate(this.facing * Math.PI / 2);
            // Stickman body horizontal
            ctx.beginPath();
            ctx.moveTo(-20, 0); ctx.lineTo(20, 0); // body
            ctx.arc(0, -25, 14, 0, Math.PI * 2); // head
            ctx.stroke();
            // Stars spinning above head
            ctx.fillStyle = '#ffcc00';
            let starAngle = Date.now() * 0.01;
            ctx.beginPath();
            ctx.arc(Math.cos(starAngle) * 25, -45 + Math.sin(starAngle)*5, 4, 0, Math.PI*2);
            ctx.arc(Math.cos(starAngle + Math.PI) * 25, -45 + Math.sin(starAngle+Math.PI)*5, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
            ctx.restore();
            return;
        }

        let headRadius = 14;
        let bodyLength = 40;
        let legLength = 40;
        let armLength = 35;

        let headX = cx;
        let headY = cy + headRadius;
        let neckX = headX;
        let neckY = headY + headRadius;
        let hipX = neckX;
        let hipY = neckY + bodyLength;

        if (this.state === 'crouch') {
            hipY -= 25;
            bodyLength -= 25;
            headY += 25;
            neckY += 25;
        }

        // Draw Head
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(headX, headY, headRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Draw Body
        ctx.beginPath();
        ctx.moveTo(neckX, neckY);
        ctx.lineTo(hipX, hipY);
        ctx.stroke();

        // Limbs animation based on state
        let leftLegX = hipX - 15, leftLegY = hipY + legLength;
        let rightLegX = hipX + 15, rightLegY = hipY + legLength;
        let leftArmX = neckX - 20, leftArmY = neckY + armLength;
        let rightArmX = neckX + 20, rightArmY = neckY + armLength;

        if (this.state === 'walk') {
            let swing = Math.sin(this.animTimer * 2) * 20;
            leftLegX += swing;
            rightLegX -= swing;
            leftArmX -= swing * 0.8;
            rightArmX += swing * 0.8;
        } else if (this.state === 'jump') {
            leftLegX -= 10; rightLegX += 10;
            leftLegY -= 15; rightLegY -= 15;
        } else if (this.state === 'attack') {
            rightArmX += this.facing * 35;
            rightArmY -= 10;
        } else if (this.state === 'hit') {
            headX -= this.facing * 10;
            hipX -= this.facing * 5;
        }

        // Legs
        ctx.beginPath();
        ctx.moveTo(hipX, hipY);
        ctx.lineTo(hipX - 10, hipY + legLength / 2);
        ctx.lineTo(leftLegX, leftLegY);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(hipX, hipY);
        ctx.lineTo(hipX + 10, hipY + legLength / 2);
        ctx.lineTo(rightLegX, rightLegY);
        ctx.stroke();

        // Arms
        ctx.beginPath();
        ctx.moveTo(neckX, neckY + 10);
        ctx.lineTo(leftArmX, leftArmY);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(neckX, neckY + 10);
        ctx.lineTo(rightArmX, rightArmY);
        ctx.stroke();

        // Directional eye indicator
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(headX + (this.facing * 5), headY - 2, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

let p1 = new Fighter(300, '#ff3355', true);
let p2 = new Fighter(940, '#3388ff', false);

function updateUI() {
    document.getElementById('p1-health').style.width = p1.health + '%';
    document.getElementById('p2-health').style.width = p2.health + '%';
}

function checkWinCondition() {
    if (p1.health <= 0 || p2.health <= 0) {
        const winScreen = document.getElementById('win-screen');
        const winText = document.getElementById('win-text');
        if (p1.health <= 0 && p2.health <= 0) {
            winText.innerText = "DRAW!";
            winText.style.color = "#ffcc00";
        } else if (p1.health <= 0) {
            winText.innerText = "PLAYER 2 WINS!";
            winText.style.color = "#3388ff";
        } else {
            winText.innerText = "PLAYER 1 WINS!";
            winText.style.color = "#ff3355";
        }
        winScreen.classList.add('active');
    }
}

function resetGame() {
    p1.reset();
    p2.reset();
    document.getElementById('win-screen').classList.remove('active');
    updateUI();
}

// Background stage drawing
function drawStage() {
    // Sky gradient background
    let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, '#110d2b');
    grad.addColorStop(0.5, '#2b1b4e');
    grad.addColorStop(1, '#151026');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Neon stage platform (Smash Bros style floating arena)
    ctx.shadowBlur = 25;
    ctx.shadowColor = '#8a2be2';
    ctx.fillStyle = '#1c1630';
    ctx.strokeStyle = '#a259ff';
    ctx.lineWidth = 4;
    
    ctx.beginPath();
    ctx.roundRect(100, 560, 1080, 120, [20, 20, 0, 0]);
    ctx.fill();
    ctx.stroke();

    // Stage grid lines for futuristic effect
    ctx.strokeStyle = 'rgba(162, 89, 255, 0.2)';
    ctx.lineWidth = 1;
    for (let i = 150; i < 1180; i += 60) {
        ctx.beginPath();
        ctx.moveTo(i, 560);
        ctx.lineTo(i - 30, 680);
        ctx.stroke();
    }
    ctx.shadowBlur = 0; // reset
}

// Game Loop
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Update
    p1.update(p2);
    p2.update(p1);
    particles.update();

    // Render
    drawStage();
    particles.draw(ctx);
    p1.draw(ctx);
    p2.draw(ctx);

    requestAnimationFrame(gameLoop);
}

// Initialize and start
updateUI();
gameLoop();
</script>
